; Raises PHP limits for the whole app. Works with the CGI/FastCGI/PHP-FPM
; SAPIs cPanel's EA-PHP normally uses (unlike .htaccess php_value, which
; only works under mod_php and can 500-error otherwise). Picked up
; automatically within a few minutes on most hosts - no restart needed.
upload_max_filesize = 64M
post_max_size = 66M
max_execution_time = 300
max_input_time = 300
memory_limit = 256M
